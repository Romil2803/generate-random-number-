<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <h1 class="heading">Cabin Seating</h1>
  
  <div id="main-box">
    <input type="text" id="name" placeholder="Enter name">
    <button class="btn" onclick="storeName()">Store Name</button> <br>
    
  </div>

  <label for="cabin1-spots">Cabin 1 (Enter number of spots):</label>
  <input type="number" id="cabin1-spots" placeholder="Enter spots for Cabin 1" min="1" max="6" value="">

  <br><br>

  <label for="cabin2-spots">Cabin 2 (Enter number of spots):</label>
  <input type="number" id="cabin2-spots" placeholder="Enter spots for Cabin 2" min="1" max="6" value="">

  <br><br>

  <label for="cabin3-spots">Cabin 3 (Enter number of spots):</label>
  <input type="number" id="cabin3-spots" placeholder="Enter spots for Cabin 3" min="1" max="6" value="">
  <button onclick="setCabinSpots()" class="btn">Set Cabin Spots</button> <br>
  <div class="submit-box">
    <label for="checkbox">
      Assign names to cabins randomly every time:
    </label>
    <input type="checkbox" id="checkbox">

    <button onclick="assignAndDisplayNames()" id="submit-btn" class="btn">Submit</button>
  </div>
  <div id="cabins"></div>
  <ul id="stored-names-list"></ul>

  <script src="./js/app.js"></script>
</body>
</html>
